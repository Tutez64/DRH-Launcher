[package]
name = "drh_launcher"
version = "0.4.0"
edition = "2024"
build = "build.rs"
license = "GPL-3.0-or-later"
authors = ["Tutez"]
description = "Install, update, configure, and play Dungeon Rampage Haxe"
homepage = "https://github.com/Tutez64/DRH-Launcher"
repository = "https://github.com/Tutez64/DRH-Launcher"

[[bin]]
name = "DRH-Launcher"
path = "src/main.rs"

# Packaged on Windows only, as `DRH-Launcher.com` (see `resources` below).
[[bin]]
name = "DRH-Launcher-console"
path = "src/bin/console.rs"

[dependencies]
cargo-packager-updater = "0.2.3"
directories = "6.0.0"
flate2 = "1.1.10"
# Stay on reqwest 0.12 while cargo-packager-updater does: 0.2.3 depends on
# reqwest 0.12 + rustls-tls-native-roots (ring). Bumping our reqwest to 0.13
# reintroduces a second HTTP/TLS stack (reqwest 0.13 + aws-lc). Patch
# releases of 0.12 are fine. Move to 0.13 only when the updater does.
#
# `rustls-tls-webpki-roots` adds Mozilla's roots, built in, to the system's.
# Windows ships only part of its trusted roots and downloads the others when
# its own APIs first verify a certificate that needs them; rustls only reads
# the store as it is, so a root no Windows API has fetched yet, such as the
# one api.github.com chains to, fails with "invalid peer certificate:
# UnknownIssuer" while browsers, which carry their own roots, work. When
# moving to 0.13, drop both root features for its default
# `rustls-platform-verifier`, which hands verification to the system
# (Windows fetches missing roots, macOS honors its keychain trust settings)
# and needs no built-in list to keep up to date.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
] }
steamlocate = "2.1.1"
tar = "0.4.46"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# The default `renderer-software` feature only embeds resources for the
# software renderer; build.rs embeds plain files, so it is dead weight here.
slint-build = { version = "1.18.1", default-features = false, features = ["compat-1-18"] }
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[package.metadata.packager]
product-name = "DRH Launcher"
identifier = "io.github.Tutez64.DRHLauncher"
publisher = "Tutez"
category = "Game"
copyright = "Copyright (c) Tutez"
icons = ["assets/icons/app-icon-256.png"]
license-file = "LICENSE"
long-description = "DRH Launcher installs, updates, configures, and launches Dungeon Rampage Haxe."
binaries = [{ path = "DRH-Launcher", main = true }]
# The console front for the modder commands. Only the Windows build has it:
# a missing source is skipped, so the AppImage and the .app carry nothing.
resources = [{ src = "target/release/DRH-Launcher-console.exe", target = "DRH-Launcher.com" }]

[package.metadata.packager.appimage.files]
"assets/icons/app-icon-16.png" = "usr/lib/DRH-Launcher/icons/16.png"
"assets/icons/app-icon-32.png" = "usr/lib/DRH-Launcher/icons/32.png"
"assets/icons/app-icon-48.png" = "usr/lib/DRH-Launcher/icons/48.png"
"assets/icons/app-icon-64.png" = "usr/lib/DRH-Launcher/icons/64.png"
"assets/icons/app-icon-128.png" = "usr/lib/DRH-Launcher/icons/128.png"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/icons/app-icon.ico"
languages = ["English"]

[package.metadata.packager.macos]
signing-identity = "-"
